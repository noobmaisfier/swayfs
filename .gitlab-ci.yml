# GitLab CI for the swayfs fork.
#
# Builds sway(fx) in an Arch container against pinned wlroots/scenefx, then
# runs the ASan/UBSan headless smoke test. The dev branch is what we develop
# on; main mirrors upstream; stable holds validated releases.

stages:
  - check
  - build
  - test

variables:
  WAYLAND_TAG: "1.24.0"
  LIBDRM_TAG: "libdrm-2.4.134"
  WLR_TAG: "0.20.2"
  SCENEFX_TAG: "0.5"
  SKIP_WAYLAND: "1"
  SKIP_LIBDRM: "1"
  GIT_DEPTH: "50"

default:
  image: archlinux:latest
  interruptible: true
  timeout: 1h
  cache:
    key: "subprojects-$WLR_TAG-$SCENEFX_TAG"
    paths:
      - subprojects/
  before_script:
    - pacman -Sy --noconfirm --needed
      base-devel meson ninja pkgconf git
      wayland wayland-protocols libxkbcommon libinput libdrm libxcb xcb-util-wm
      json-c pcre2 cairo fcft fontconfig libevdev pixman
      libdisplay-info seatd hwdata mesa libglvnd vulkan-headers vulkan-icd-loader
      lcms2 scdoc foot grim jq python
    - git config --global --add safe.directory '*'
    - bash ci/fetch-subprojects.sh

check:
  stage: check
  cache: {}
  before_script:
    - pacman -Sy --noconfirm --needed git python
  script:
    - git diff --check
    - test -f meson.build
    - test -f ci/asan-smoke.sh
    - bash -n ci/fetch-subprojects.sh ci/asan-smoke.sh
    - bash -n ci/render-smoke.sh packaging/aur/swayfs/PKGBUILD
    - python3 -m py_compile ci/ppm-stats.py
    - echo "check OK"

build:
  stage: build
  script:
    - meson setup build --buildtype=release -Dwlroots:werror=false -Dscenefx:werror=false
    - ninja -C build
    - ./build/sway/sway --version
  artifacts:
    paths:
      - build/sway/sway
      - build/swaymsg/swaymsg
      - build/swaynag/swaynag
    expire_in: 1 week

test:asan:
  stage: test
  dependencies: []
  script:
    - meson setup build-asan -Db_lto=false -Db_sanitize=address,undefined -Db_ndebug=false -Dwlroots:werror=false -Dscenefx:werror=false
    - ninja -C build-asan
    - bash ci/asan-smoke.sh build-asan

# Rendering regression test: drives a real client on a nested headless sway and
# inspects the framebuffer with grim. Catches the workspace-fade class of bugs
# (e.g. a populated workspace left fully transparent after visiting an empty
# one) that IPC-only tests cannot see. Skips when no DRM render node is present
# (scenefx has no pixman fallback), so it is a no-op on shared runners.
test:render:
  stage: test
  dependencies: []
  script:
    - meson setup build-render --buildtype=release -Dwlroots:werror=false -Dscenefx:werror=false
    - ninja -C build-render
    - bash ci/render-smoke.sh build-render
